services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: ./envs/.env.production
        required: false
    ports:
      - "${PORT:-3424}:${PORT:-3424}"
    environment:
      PORT: ${PORT:-3424}
      NODE_ENV: production
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
